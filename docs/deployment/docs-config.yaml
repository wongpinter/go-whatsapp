# Documentation Deployment Configuration
# This file configures the documentation build and deployment process

metadata:
  name: whatsapp-go-docs
  version: "1.0.0"
  description: WhatsApp Go Library Documentation
  repository: github.com/wongpinter/go-whatsapp
  last_updated: "2025-07-02"

# Documentation structure configuration
structure:
  source_directories:
    - path: "."
      description: "Main project README"
      files: ["README.md"]
      
    - path: "bm/"
      description: "Business Management package docs"
      files: ["README.md"]
      
    - path: "flows/"
      description: "Flows package documentation"
      files: ["README.md", "USAGE.md"]
      
    - path: "docs/"
      description: "Technical documentation"
      files: ["*.md"]

  output_directories:
    - path: "docs/"
      description: "Main documentation directory"
      
    - path: "docs/structured/"
      description: "Organized documentation sections"
      
    - path: "docs/llm/"
      description: "LLM-friendly formats"
      
    - path: "docs/deployment/"
      description: "Deployment configuration"

# Build configuration
build:
  formats:
    human_readable:
      - name: "Complete Guide"
        file: "docs/COMPLETE_GUIDE.md"
        description: "Comprehensive single-document guide"
        target_audience: ["developers", "architects", "new_users"]
        
      - name: "Documentation Index"
        file: "docs/INDEX.md"
        description: "Navigation and quick access guide"
        target_audience: ["all_users"]
        
      - name: "Structured README"
        file: "docs/structured/README.md"
        description: "Documentation organization guide"
        target_audience: ["contributors", "maintainers"]

    llm_friendly:
      - name: "Structured Text"
        file: "docs/llm/whatsapp-go-docs.txt"
        description: "AI-optimized text format"
        target_audience: ["ai_agents", "code_generation"]
        
      - name: "JSON Schema"
        file: "docs/llm/whatsapp-go-schema.json"
        description: "Machine-readable API definitions"
        target_audience: ["tooling", "validation"]
        
      - name: "YAML Configuration"
        file: "docs/llm/whatsapp-go-config.yaml"
        description: "Configuration and automation"
        target_audience: ["ci_cd", "automation"]

# Quality assurance configuration
quality:
  checks:
    completeness:
      - api_coverage: 100
      - example_coverage: 95
      - error_coverage: 90
      
    accuracy:
      - code_examples_tested: true
      - api_signatures_verified: true
      - cross_references_valid: true
      
    consistency:
      - terminology_standardized: true
      - formatting_unified: true
      - version_synchronized: true

  validation:
    markdown:
      - lint: true
      - link_check: true
      - spell_check: false  # Disabled due to technical terms
      
    json:
      - syntax_valid: true
      - schema_valid: true
      
    yaml:
      - syntax_valid: true
      - structure_valid: true

# Deployment configuration
deployment:
  targets:
    github_pages:
      enabled: false
      branch: "gh-pages"
      directory: "docs/"
      
    github_wiki:
      enabled: false
      sync: true
      
    repository_docs:
      enabled: true
      directory: "docs/"
      auto_update: true

  automation:
    triggers:
      - on_push: ["main", "develop"]
      - on_release: true
      - on_schedule: "0 0 * * 0"  # Weekly
      
    actions:
      - validate_docs: true
      - update_timestamps: true
      - sync_versions: true
      - generate_index: true

# Access configuration
access:
  public:
    - "docs/INDEX.md"
    - "docs/COMPLETE_GUIDE.md"
    - "docs/structured/"
    - "docs/llm/"
    
  internal:
    - "docs/deployment/"
    - "docs/maintenance/"

# Integration configuration
integration:
  ai_systems:
    primary_endpoint: "docs/llm/whatsapp-go-docs.txt"
    schema_endpoint: "docs/llm/whatsapp-go-schema.json"
    config_endpoint: "docs/llm/whatsapp-go-config.yaml"
    
  mcp_systems:
    context_files:
      - "docs/llm/whatsapp-go-docs.txt"
      - "docs/COMPLETE_GUIDE.md"
    schema_files:
      - "docs/llm/whatsapp-go-schema.json"
    config_files:
      - "docs/llm/whatsapp-go-config.yaml"

  documentation_tools:
    generators:
      - godoc: true
      - swagger: false
      - openapi: false
      
    validators:
      - markdown_lint: true
      - link_checker: true
      - spell_checker: false

# Maintenance configuration
maintenance:
  update_schedule:
    frequency: "on_release"
    auto_update: true
    
  version_control:
    track_changes: true
    maintain_history: true
    
  monitoring:
    usage_analytics: false
    error_tracking: true
    performance_monitoring: false

# Content management
content:
  sources:
    primary:
      - "README.md"
      - "bm/README.md"
      - "flows/README.md"
      - "flows/USAGE.md"
      - "docs/*.md"
      
    generated:
      - "docs/COMPLETE_GUIDE.md"
      - "docs/INDEX.md"
      - "docs/llm/*.txt"
      - "docs/llm/*.json"
      - "docs/llm/*.yaml"

  templates:
    api_reference: "templates/api-reference.md"
    user_guide: "templates/user-guide.md"
    troubleshooting: "templates/troubleshooting.md"

# Performance configuration
performance:
  optimization:
    compress_images: false
    minify_json: false
    cache_static: true
    
  limits:
    max_file_size: "10MB"
    max_total_size: "50MB"
    
  monitoring:
    load_times: false
    file_sizes: true

# Security configuration
security:
  access_control:
    public_docs: true
    private_sections: ["deployment", "maintenance"]
    
  content_validation:
    sanitize_html: false
    validate_links: true
    check_credentials: true

# Notification configuration
notifications:
  channels:
    email: false
    slack: false
    github_issues: true
    
  events:
    build_success: false
    build_failure: true
    validation_errors: true
    deployment_complete: false

# Backup configuration
backup:
  enabled: true
  frequency: "daily"
  retention: "30 days"
  location: "backups/"
  
  include:
    - "docs/"
    - "README.md"
    - "*/README.md"
    - "*/USAGE.md"

# Analytics configuration
analytics:
  enabled: false
  provider: null
  tracking_id: null
  
  metrics:
    page_views: false
    user_engagement: false
    search_queries: false

# Internationalization configuration
i18n:
  enabled: false
  default_language: "en"
  supported_languages: ["en"]
  
  translation:
    auto_translate: false
    human_review: true

# Custom configuration
custom:
  branding:
    library_name: "WhatsApp Go Library"
    organization: "wongpinter"
    
  features:
    search: false
    comments: false
    feedback: false
    
  styling:
    theme: "default"
    custom_css: false
